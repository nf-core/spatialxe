name: spoqc_annotation
description: |
  Generate unsupervised cell-type annotation for a SpatialData object.

  Only runs when no cell-type annotation file was supplied upstream (`when: !annotation || (annotation instanceof List && annotation.isEmpty())`); otherwise the pipeline uses the user-supplied annotation directly.
keywords:
  - spatial transcriptomics
  - quality control
  - spoqc
  - xenium
  - cell type annotation
tools:
  - "spoqc":
      description: |
        spoQC is a custom quality-control toolkit for spatial single-cell and single-transcript
        segmentation QC of spatial omics (10x Xenium) data, operating on SpatialData objects.
      homepage: https://github.com/heylf/spoQC
      documentation: https://github.com/heylf/spoQC
      licence: ["MIT license"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample' ]
    - spatialdata:
        type: directory
        description: Path to the SpatialData zarr store to run QC on
        ontologies: []
  - annotation:
      type: file
      description: |
        Optional cell-type annotation file. Not passed to the script; only consulted in the
        process `when:` guard, which runs this module exclusively when no annotation was
        supplied upstream (i.e. this input is always empty/absent whenever the process runs).
      pattern: "*.tsv"
      ontologies: []
  - step:
      type: string
      description: Name of the spoQC step to run, passed to `spoqc -s`
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample' ]
      - "report":
          type: directory
          description: HTML/plot QC report directory produced for this step
          ontologies: []
  annotation:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample' ]
      - "unsupervised_cell_annotation.tsv":
          type: file
          description: Unsupervised cell-type annotation table generated when no annotation was supplied.
          pattern: "unsupervised_cell_annotation.tsv"
          ontologies: []
  versions_spoqc:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@heylf"
maintainers:
  - "@heylf"
