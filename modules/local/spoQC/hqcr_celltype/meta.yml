name: spoqc_hqcr_celltype
description: |
  Refine the high-quality cell region (HQCR) mask using cell-type information, combining the general/bubble/doublet/void/cell QC outputs.
keywords:
  - spatial transcriptomics
  - quality control
  - spoqc
  - xenium
  - hqcr
  - cell type refinement
tools:
  - "spoqc":
      description: |
        spoQC is a custom quality-control toolkit for spatial single-cell and single-transcript
        segmentation QC of spatial omics (10x Xenium) data, operating on SpatialData objects.
      homepage: https://github.com/heylf/spoQC
      documentation: https://github.com/heylf/spoQC
      licence: ["MIT license"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample' ]
    - spatialdata:
        type: directory
        description: Path to the SpatialData zarr store to run QC on
        ontologies: []
  - annotation:
      type: file
      description: |
        Optional cell-type annotation file. When empty/absent, spoqc is run without the `-a` flag.
      pattern: "*.tsv"
      ontologies: []
  - step:
      type: string
      description: Name of the spoQC step to run, passed to `spoqc -s`
  - tmp_general:
      type: file
      description: General QC parquet output from SPOQC_GENERAL
      pattern: "generalqc_output_hqcr.parquet"
      ontologies: []
  - tmp_bubble:
      type: file
      description: Bubble QC parquet output from SPOQC_BUBBLE
      pattern: "bubbleqc_output_hqcr.parquet"
      ontologies: []
  - tmp_doublet:
      type: file
      description: Doublet QC parquet output from SPOQC_DOUBLET
      pattern: "doubletqc_output_hqcr.parquet"
      ontologies: []
  - tmp_void:
      type: file
      description: Void QC parquet output from SPOQC_VOID
      pattern: "voidqc_output_hqcr.parquet"
      ontologies: []
  - tmp_cell:
      type: file
      description: Cell QC parquet output from SPOQC_CELL
      pattern: "cellqc_output_hqcr.parquet"
      ontologies: []
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample' ]
      - "report":
          type: directory
          description: HTML/plot QC report directory produced for this step
          ontologies: []
  mask:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample' ]
      - "mask":
          type: file
          description: Cell-type-refined, smoothed HQCR mask
          pattern: "hqcr_output_mask_smoothed_celltype_refined.parquet"
          ontologies: []
  versions_spoqc:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@heylf"
maintainers:
  - "@heylf"
