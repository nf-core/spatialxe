name: spoqc_hqtr_refinement
description: |
  Refine the high-quality transcript region (HQTR) probability mask into a smoothed mask.
keywords:
  - spatial transcriptomics
  - quality control
  - spoqc
  - xenium
  - hqtr
  - mask refinement
tools:
  - "spoqc":
      description: |
        spoQC is a custom quality-control toolkit for spatial single-cell and single-transcript
        segmentation QC of spatial omics (10x Xenium) data, operating on SpatialData objects.
      homepage: https://github.com/heylf/spoQC
      documentation: https://github.com/heylf/spoQC
      tool_dev_url:
      licence: ["MIT license"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample' ]
    - spatialdata:
        type: folder
        description: Path to the SpatialData zarr store to run QC on
  - annotation:
      type: file
      description: |
        Optional cell-type annotation file. When empty/absent, spoqc is run without the `-a` flag.
      pattern: "*.tsv"
  - step:
      type: string
      description: Name of the spoQC step to run, passed to `spoqc -s`
  - mask:
      type: directory
      description: HQTR raw mask from SPOQC_HQTR_CLUSTERING
      pattern: "hqtr_output_mask_raw"
output:
  - report:
      type: directory
      description: HTML/plot QC report directory produced for this step
  - mask_smoothed:
      type: directory
      description: Smoothed HQTR mask
      pattern: "hqtr_output_mask_smoothed_raw"
  - versions_spoqc:
      - - "${task.process}":
            type: string
            description: The process the versions were collected from
        - spoqc:
            type: string
            description: The tool name
        - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
            type: eval
            description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@heylf"
