name: spoqc_hqpr_refinement
description: |
  Refine the per-staining high-quality pixel region (HQPR) probability mask into a smoothed mask.
keywords:
  - spatial transcriptomics
  - quality control
  - spoqc
  - xenium
  - hqpr
  - mask refinement
tools:
  - "spoqc":
      description: |
        spoQC is a custom quality-control toolkit for spatial single-cell and single-transcript
        segmentation QC of spatial omics (10x Xenium) data, operating on SpatialData objects.
      homepage: https://github.com/heylf/spoQC
      documentation: https://github.com/heylf/spoQC
      tool_dev_url:
      licence: ["MIT license"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample' ]
    - spatialdata:
        type: folder
        description: Path to the SpatialData zarr store to run QC on
    - staining_idx_sd:
        type: integer
        description: Staining index carried alongside spatialdata to align the per-staining combined channel (Groovy var `_stain_sd`)
  - - annotation:
        type: file
        description: |
          Optional cell-type annotation file. When empty/absent, spoqc is run without the `-a` flag.
        pattern: "*.tsv"
    - staining_idx_ann:
        type: integer
        description: Staining index carried alongside annotation to align the per-staining combined channel (Groovy var `_stain_ann`)
  - step:
      type: string
      description: Name of the spoQC step to run, passed to `spoqc -s`
  - - staining:
        type: integer
        description: Staining index
    - mask:
        type: file
        description: Per-staining HQPR raw probability mask from SPOQC_HQPR_CLUSTERING
        pattern: "spoQC_tmp/*"
output:
  - - staining:
        type: integer
        description: Staining index
    - report:
        type: directory
        description: HTML/plot QC report directory for this staining, tagged with the staining index
        pattern: "report/hqpr/${staining}/hqpr_refinement"
  - - staining:
        type: integer
        description: Staining index
    - mask:
        type: file
        description: Per-staining smoothed HQPR mask
        pattern: "spoQC_tmp/hqpr_${staining}_output_mask_smoothed_raw"
  - versions_spoqc:
      - - "${task.process}":
            type: string
            description: The process the versions were collected from
        - spoqc:
            type: string
            description: The tool name
        - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
            type: eval
            description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@heylf"
