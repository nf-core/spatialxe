name: spoqc_ambient
description: |
  Run ambient-RNA (background gene) QC checks on a SpatialData object.
keywords:
  - spatial transcriptomics
  - quality control
  - spoqc
  - xenium
  - ambient rna
tools:
  - "spoqc":
      description: |
        spoQC is a custom quality-control toolkit for spatial single-cell and single-transcript
        segmentation QC of spatial omics (10x Xenium) data, operating on SpatialData objects.
      homepage: https://github.com/heylf/spoQC
      documentation: https://github.com/heylf/spoQC
      tool_dev_url:
      licence: ["MIT license"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample' ]
    - spatialdata:
        type: folder
        description: Path to the SpatialData zarr store to run QC on
  - step:
      type: string
      description: Name of the spoQC step to run, passed to `spoqc -s`
output:
  - report:
      type: directory
      description: HTML/plot QC report directory produced for this step
  - tmp:
      type: file
      description: |
        Per-gene ambient-RNA QC parquet output, consumed by the HQTR ambient-contamination (hqtr_ac) step.
      pattern: "ambient_output_genes.parquet"
  - versions_spoqc:
      - - "${task.process}":
            type: string
            description: The process the versions were collected from
        - spoqc:
            type: string
            description: The tool name
        - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
            type: eval
            description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@heylf"
