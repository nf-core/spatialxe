name: spoqc_hqpr_metrices
description: |
  Compute per-staining high-quality pixel region (HQPR) metrics for a SpatialData object.
keywords:
  - spatial transcriptomics
  - quality control
  - spoqc
  - xenium
  - hqpr
  - high quality pixel region
tools:
  - "spoqc":
      description: |
        spoQC is a custom quality-control toolkit for spatial single-cell and single-transcript
        segmentation QC of spatial omics (10x Xenium) data, operating on SpatialData objects.
      homepage: https://github.com/heylf/spoQC
      documentation: https://github.com/heylf/spoQC
      tool_dev_url:
      licence: ["MIT license"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample' ]
    - spatialdata:
        type: folder
        description: Path to the SpatialData zarr store to run QC on
  - annotation:
      type: file
      description: |
        Optional cell-type annotation file. When empty/absent, spoqc is run without the `-a` flag.
      pattern: "*.tsv"
  - staining:
      type: integer
      description: Staining index to compute metrics for (iterated via Nextflow `each`)
  - step:
      type: string
      description: Name of the spoQC step to run, passed to `spoqc -s`
output:
  - - staining:
        type: integer
        description: Staining index
    - report:
        type: directory
        description: HTML/plot QC report directory for this staining, tagged with the staining index
        pattern: "report/hqpr/${staining}/hqpr_metrices"
  - - staining:
        type: integer
        description: Staining index
    - metrices:
        type: directory
        description: Per-staining HQPR metrics directory, tagged with the staining index
        pattern: "spoQC_tmp/metrices/hqpr/${staining}"
  - staininglog:
      type: file
      description: Log of stainings processed
      pattern: "report/staining_log.txt"
  - versions_spoqc:
      - - "${task.process}":
            type: string
            description: The process the versions were collected from
        - spoqc:
            type: string
            description: The tool name
        - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
            type: eval
            description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@heylf"
