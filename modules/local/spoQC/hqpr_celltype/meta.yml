name: spoqc_hqpr_celltype
description: |
  Run per-staining high-quality pixel region (HQPR) cell-type QC, combining the general/bubble/doublet/void/cell QC outputs with the HQPR probability and mask.
keywords:
  - spatial transcriptomics
  - quality control
  - spoqc
  - xenium
  - hqpr
  - cell type
tools:
  - "spoqc":
      description: |
        spoQC is a custom quality-control toolkit for spatial single-cell and single-transcript
        segmentation QC of spatial omics (10x Xenium) data, operating on SpatialData objects.
      homepage: https://github.com/heylf/spoQC
      documentation: https://github.com/heylf/spoQC
      tool_dev_url:
      licence: ["MIT license"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample' ]
    - spatialdata:
        type: folder
        description: Path to the SpatialData zarr store to run QC on
    - staining_idx_sd:
        type: integer
        description: Staining index carried alongside spatialdata to align the per-staining combined channel (Groovy var `_stain_sd`)
  - - annotation:
        type: file
        description: |
          Optional cell-type annotation file. When empty/absent, spoqc is run without the `-a` flag.
        pattern: "*.tsv"
    - staining_idx_ann:
        type: integer
        description: Staining index carried alongside annotation to align the per-staining combined channel (Groovy var `_stain_ann`)
  - step:
      type: string
      description: Name of the spoQC step to run, passed to `spoqc -s`
  - - tmp_general:
        type: file
        description: General QC parquet output from SPOQC_GENERAL, tagged with the staining index
    - staining_idx_g:
        type: integer
        description: Staining index carried alongside tmp_general to align the per-staining combined channel (Groovy var `_stain_g`)
  - - tmp_bubble:
        type: file
        description: Bubble QC parquet output from SPOQC_BUBBLE, tagged with the staining index
    - staining_idx_b:
        type: integer
        description: Staining index carried alongside tmp_bubble to align the per-staining combined channel (Groovy var `_stain_b`)
  - - tmp_doublet:
        type: file
        description: Doublet QC parquet output from SPOQC_DOUBLET, tagged with the staining index
    - staining_idx_d:
        type: integer
        description: Staining index carried alongside tmp_doublet to align the per-staining combined channel (Groovy var `_stain_d`)
  - - tmp_void:
        type: file
        description: Void QC parquet output from SPOQC_VOID, tagged with the staining index
    - staining_idx_v:
        type: integer
        description: Staining index carried alongside tmp_void to align the per-staining combined channel (Groovy var `_stain_v`)
  - - tmp_cell:
        type: file
        description: Cell QC parquet output from SPOQC_CELL, tagged with the staining index
    - staining_idx_c:
        type: integer
        description: Staining index carried alongside tmp_cell to align the per-staining combined channel (Groovy var `_stain_c`)
  - - staining:
        type: integer
        description: Staining index
    - mask:
        type: directory
        description: Per-staining HQPR raw probability mask from SPOQC_HQPR_CLUSTERING
        pattern: "spoQC_tmp/*"
    - mask_smoothed:
        type: directory
        description: Per-staining smoothed HQPR mask from SPOQC_HQPR_REFINEMENT
        pattern: "spoQC_tmp/*"
output:
  - report:
      type: directory
      description: HTML/plot QC report directory for this staining, tagged with the staining index
      pattern: "report/hqpr/hqpr_celltype/${staining}"
  - versions_spoqc:
      - - "${task.process}":
            type: string
            description: The process the versions were collected from
        - spoqc:
            type: string
            description: The tool name
        - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
            type: eval
            description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@heylf"
