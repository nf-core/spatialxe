name: spoqc_hqtr_clustering
description: |
  Cluster high-quality transcript region (HQTR) metrics, quality-value and ambient-contamination probabilities into a raw mask.
keywords:
  - spatial transcriptomics
  - quality control
  - spoqc
  - xenium
  - hqtr
  - clustering
tools:
  - "spoqc":
      description: |
        spoQC is a custom quality-control toolkit for spatial single-cell and single-transcript
        segmentation QC of spatial omics (10x Xenium) data, operating on SpatialData objects.
      homepage: https://github.com/heylf/spoQC
      documentation: https://github.com/heylf/spoQC
      tool_dev_url:
      licence: ["MIT license"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample' ]
    - spatialdata:
        type: folder
        description: Path to the SpatialData zarr store to run QC on
  - step:
      type: string
      description: Name of the spoQC step to run, passed to `spoqc -s`
  - metrices:
      type: directory
      description: HQTR metrics directory from SPOQC_HQTR_METRICES
      pattern: "spoQC_tmp/metrices/hqtr"
  - qv:
      type: directory
      description: HQTR quality-value probability output from SPOQC_HQTR_QV
      pattern: "spoQC_tmp/*"
  - ac:
      type: directory
      description: HQTR ambient-contamination probability output from SPOQC_HQTR_AC
      pattern: "spoQC_tmp/*"
output:
  - report:
      type: directory
      description: HTML/plot QC report directory produced for this step
  - mask:
      type: directory
      description: HQTR raw probability mask
      pattern: "hqtr_output_mask_raw"
  - versions_spoqc:
      - - "${task.process}":
            type: string
            description: The process the versions were collected from
        - spoqc:
            type: string
            description: The tool name
        - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
            type: eval
            description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from
      - spoqc:
          type: string
          description: The tool name
      - "spoqc --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' || echo unknown":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@heylf"
