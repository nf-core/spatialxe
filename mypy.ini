[mypy]
# The QC scripts below are vendored from the upstream nf-xenium-processing repo
# and are kept byte-identical to it apart from documented, mechanical
# adaptations (the inlined helper block that replaces the xenium_helpers
# dependency, and the recorded molecule -> transcript rename). They are
# maintained and type-checked upstream and are re-synced wholesale, so they are
# excluded here: annotating them locally would fork them from upstream and turn
# every future re-sync into a manual merge. All other bin/ scripts are still
# type-checked by `make typecheck`.
#
# Re-sync procedure for these files is documented in the port manifests.
exclude = (?x)(
    ^bin/image_qc\.py$
    | ^bin/snr_metrics\.py$
    | ^bin/transcript_qc_processing\.py$
    | ^bin/transcript_stream\.py$
  )
