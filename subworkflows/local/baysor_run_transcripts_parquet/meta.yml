# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "baysor_run_transcripts_parquet"
description: to run the `baysor run` command with the transcripts.parquet file as a coordinate-based segmentation run
keywords:
  - baysor
  - baysor run
  - segmentation
  - xeniumranger import-segmentation
  - coordinate-based segmentation
  - transcript filtering
  - polygons
components:
  - baysor/preprocess/transcripts
  - baysor/estimate/scale/factor
  - baysor/run
  - xeniumranger/import/segmentation
  - split/transcripts
  - parquet2csv
  - reconstruct/patches
  - xenium/patch/divide
  - xenium/patch/stitch
input:
  - ch_bundle_path:
      description: |
        path to the xenium bundle
        Structure: [ val(meta), path("path-to-xenium-bundle") ]
  - ch_transcripts_parquet:
      description: |
        input parquet file from the xenium bundle
        Structure: [ val(meta), path("path-to-transcripts.parquet") ]
  - ch_morphology_image:
      description: |
        the morphology_focus.ome.tif file from the xenium bundle
        Structure: [ val(meta), path("morphology_focus.ome.tif") ]
  - ch_config:
      description: |
        config file for the xenium baysor run (stored in assets/config/xenium.toml)
        Structure: [ path("path-to-xenium.toml") ]
  - ch_prior_mask:
      description: |
        the resized_mask.tif file from the xenium bundle (or empty for cellpose)
        Structure: [ val(meta), path("resized_mask.tif") ] or empty
  - baysor_scale:
      description: |
        the --scale parameter for the baysor run command (for non-tiled runs)
        Structure: [ val("integer") ]
  - baysor_tiling:
      description: |
        whether to enable tiling for the baysor run command
        Structure: [ val("boolean") ]
  - baysor_tiling_scale:
      description: |
        the --scale parameter for the baysor run command (for tiled runs)
        Structure: [ val("integer") ]
  - max_x:
      description: |
        maximum x coordinate for spatial filtering of transcripts
        Structure: [ val("integer") ]
  - max_y:
      description: |
        maximum y coordinate for spatial filtering of transcripts
        Structure: [ val("integer") ]
  - min_qv:
      description: |
        minimum QV for spatial filtering of transcripts
        Structure: [ val("integer") ]
  - min_x:
      description: |
        minimum x coordinate for spatial filtering of transcripts
        Structure: [ val("integer") ]
  - min_y:
      description: |
        minimum y coordinate for spatial filtering of transcripts
        Structure: [ val("integer") ]
  - ch_polygon_format:
      description: |
        the polygon format for the baysor run command
        Structure: [ val("GeometryCollectionLegacy") ]
output:
  - segmentation:
      description: |
        the segmentation.csv file generated from the baysor run command
        Structure: [ val(meta), path("segmentation.csv") ]
  - polygons2d:
      description: |
        the segmentation_polygons_2d.json file generated from the baysor run command
        Structure: [ val(meta), path("segmentation_polygons_2d.json") ]
  - htmls:
      description: |
        the html files generated from the baysor run command
        Structure: [ val(meta), path("*.html") ]
  - coordinate_space:
      description: |
        the coordinate space in which xeniumranger import-segmentation was run
        Structure: [ val("microns") ]
  - redefined_bundle:
      description: |
        the redefined xenium bundle generated with the segmentation results from baysor
        Structure: [ val(meta), ["redefined-xenium-bundle"] ]
authors:
  - "@khersameesh24"
maintainers:
  - "@khersameesh24"
